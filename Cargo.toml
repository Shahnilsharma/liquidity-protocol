[package]
name = "liquidity-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true }
cw-storage-plus = { workspace = true }
cw2 = { workspace = true }
prost = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
cosmwasm-std = { workspace = true }
proptest = { workspace = true }
cw-multi-test = { workspace = true }

defa-credit-manager = { path = "contracts/credit-manager" }
defa-types = { path = "packages/defa-types" }
defa-pool-factory = { path = "contracts/pool-factory" }
defa-psp-pool = { path = "contracts/psp-pool" }
defa-yield-distributor = { path = "contracts/yield-distributor" }
defa_yield_reserve = { path = "contracts/yield-reserve" }

[workspace]
resolver = "2"
members = [
  "contracts/pool-factory",
  "contracts/psp-pool",
  "contracts/credit-manager",
  "contracts/yield-distributor",
  "contracts/yield-reserve",
  "packages/defa-types",
]
default-members = [
  "contracts/pool-factory",
  "contracts/psp-pool",
  "contracts/credit-manager",
  "contracts/yield-distributor",
  "contracts/yield-reserve",
  "packages/defa-types",
]

[workspace.dependencies]
cosmwasm-schema = "2.3.0"
cosmwasm-std = { version = "2.3.0", features = ["cosmwasm_2_2", "stargate"] }
cw-storage-plus = "2.0.0"
cw2 = "2.0.0"
prost = "0.13"
prost-types = "0.13"
schemars = "0.8.22"
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
thiserror = "2.0.17"
cw-multi-test = "2.0.0"
proptest = "1.10.0"
test-case = "3.3"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true
