[package]
name = "liquidity-protocol"
version = "0.1.0"
authors = ["shahnilsharma <shahnil.sharma402@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[package.metadata.scripts]
optimize = """docker run --rm -v "$(pwd)":/code \
  --mount type=volume,source="$(basename "$(pwd)")_cache",target=/target \
  --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
  cosmwasm/optimizer:0.16.1
"""

[dependencies]
cosmwasm-schema = "2.3.0"
cosmwasm-std = { version = "2.3.0", features = ["cosmwasm_2_2"] }
cw-storage-plus = "2.0.0"
cw2 = "2.0.0"
cw20 = "2.0.0"
cw20-base = { version = "2.0.0", features = ["library"] }
schemars = "0.8.21"
serde = { version = "1.0.215", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.9" }

[dev-dependencies]
cw-multi-test = "2.0.0"
